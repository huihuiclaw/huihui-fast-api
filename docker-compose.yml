services:
  api:
    build: .
    container_name: huihui-fast-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=info
    env_file:
      - .env
    volumes:
      - huihui-fast-api-state:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  huihui-fast-api-state: