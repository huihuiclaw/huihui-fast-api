name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start service in background
        env:
          ADMOB_CLIENT_ID: ${{ secrets.ADMOB_CLIENT_ID }}
          ADMOB_CLIENT_SECRET: ${{ secrets.ADMOB_CLIENT_SECRET }}
          ADMOB_REFRESH_TOKEN: ${{ secrets.ADMOB_REFRESH_TOKEN }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          FEEDBACK_GH_TOKEN: ${{ secrets.FEEDBACK_GH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          python -u -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level info > /tmp/uvicorn.log 2>&1 &
          echo "uvicorn pid=$!"
          sleep 4
          echo "--- uvicorn log so far ---"
          cat /tmp/uvicorn.log
          echo "--- end log ---"

      - name: Smoke test endpoints
        env:
          ADMOB_CLIENT_ID: ${{ secrets.ADMOB_CLIENT_ID }}
          ADMOB_CLIENT_SECRET: ${{ secrets.ADMOB_CLIENT_SECRET }}
          ADMOB_REFRESH_TOKEN: ${{ secrets.ADMOB_REFRESH_TOKEN }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          FEEDBACK_GH_TOKEN: ${{ secrets.FEEDBACK_GH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          set +e
          curl -sS http://127.0.0.1:8000/health; echo
          curl -sS http://127.0.0.1:8000/ready; echo
          curl -sS "http://127.0.0.1:8000/admob/earnings?days=7" | python -m json.tool
          echo "--- gmail dry-run ---"
          curl -sS "http://127.0.0.1:8000/gmail/feedback?max=5" | python -m json.tool || echo "(gmail failed)"
          echo "--- gmail state ---"
          curl -sS "http://127.0.0.1:8000/gmail/feedback/state" | python -m json.tool